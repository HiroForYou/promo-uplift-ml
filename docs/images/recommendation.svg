<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .box { fill: #F4F6F7; stroke: #CBD0D3; stroke-width: 1.5; }
    .title { fill: #14212B; font-family: Fraunces, Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 600; }
    .sub { fill: #4A5963; font-size: 11.5px; }
    .label { fill: #4A5963; font-size: 11.5px; font-style: italic; }
    .mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; }
  </style>
  <rect width="1100" height="340" fill="#E6E9EA"/>
  <defs>
    <marker id="ink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14212B"/></marker>
    <marker id="rust" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#A8420E"/></marker>
    <marker id="muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8B949B"/></marker>
  </defs>
  <rect class="box" x="20" y="135" width="155" height="70" rx="6"/>
  <text class="title" x="97.5" y="169.0" text-anchor="middle">Combo</text>
  <text class="sub" x="97.5" y="189.0" text-anchor="middle">store · generic · discount</text>
  <rect x="205" y="135" width="140" height="70" rx="6" fill="#14212B"/>
  <text class="title" x="275.0" y="169.0" text-anchor="middle" style="fill:#FFFFFF">XGBoost</text>
  <text class="mono" x="275.0" y="189.0" text-anchor="middle" font-size="11.5" fill="#CBD0D3">uplift_pct</text>
  <rect class="box" x="375" y="135" width="160" height="70" rx="6"/>
  <text class="title" x="455.0" y="169.0" text-anchor="middle">Base light</text>
  <text class="sub" x="455.0" y="189.0" text-anchor="middle">≥ 15% GO · ≥ 5% CONSIDER</text>
  <rect class="box" x="565" y="135" width="160" height="70" rx="6"/>
  <text class="title" x="645.0" y="169.0" text-anchor="middle">Extrapolated?</text>
  <text class="sub" x="645.0" y="189.0" text-anchor="middle">discount &gt; hist. max</text>
  <rect class="box" x="755" y="135" width="165" height="70" rx="6"/>
  <text class="title" x="837.5" y="169.0" text-anchor="middle">Thin baseline?</text>
  <text class="sub" x="837.5" y="189.0" text-anchor="middle">too little history</text>
  <rect x="955" y="40" width="125" height="60" rx="6" fill="#14212B"/>
  <text class="title" x="1017.5" y="69.0" text-anchor="middle" style="fill:#FFFFFF">GO</text>
  <text x="1017.5" y="89.0" text-anchor="middle" font-size="11.5" fill="#CBD0D3">run the promo</text>
  <rect class="box" x="955" y="140" width="125" height="60" rx="6" stroke="#A8420E"/>
  <text class="title" x="1017.5" y="169.0" text-anchor="middle">CONSIDER</text>
  <text class="sub" x="1017.5" y="189.0" text-anchor="middle">review first</text>
  <rect class="box" x="955" y="240" width="125" height="60" rx="6"/>
  <text class="title" x="1017.5" y="269.0" text-anchor="middle">AVOID</text>
  <text class="sub" x="1017.5" y="289.0" text-anchor="middle">skip it</text>
  <path class="flow" d="M175,170 H205" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M345,170 H375" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M535,170 H565" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M725,170 H755" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M920,160 C940,160 935,70 955,70" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M920,170 H955" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>
  <path class="flow" d="M920,180 C940,180 935,270 955,270" stroke="#8B949B" stroke-width="1.5" fill="none" marker-end="url(#muted)"/>
  <text class="label" x="645" y="120" text-anchor="middle">GO capped at CONSIDER</text>
  <text class="label" x="837" y="120" text-anchor="middle">forced to AVOID</text>
  <text x="550.0" y="325" fill="#4A5963" font-size="12.5" text-anchor="middle">The model sets the base light from uplift. The two guard rules can only lower it. Thresholds live in config.py.</text>
</svg>
