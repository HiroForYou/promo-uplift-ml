<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <style>
    .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .box { fill: #F4F6F7; stroke: #CBD0D3; stroke-width: 1.5; }
    .title { fill: #14212B; font-family: Fraunces, Georgia, 'Times New Roman', serif; font-size: 17px; font-weight: 600; }
    .sub { fill: #4A5963; font-size: 11.5px; }
    .label { fill: #4A5963; font-size: 11.5px; font-style: italic; }
    .mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; }
  </style>
  <rect width="1100" height="540" fill="#E6E9EA"/>
  <defs>
    <marker id="ink" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14212B"/></marker>
    <marker id="rust" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#A8420E"/></marker>
    <marker id="muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8B949B"/></marker>
  </defs>
  <rect class="box" x="20" y="200" width="145" height="70" rx="6"/>
  <text class="title" x="92.5" y="227.0" text-anchor="middle">Datos SAP</text>
  <text class="sub" x="92.5" y="247.0" text-anchor="middle">S3 Parquet</text>
  <text class="sub" x="92.5" y="262.0" text-anchor="middle">ventas · precios · stock</text>
  <rect class="box" x="200" y="200" width="150" height="70" rx="6"/>
  <text class="title" x="275.0" y="227.0" text-anchor="middle">deploy/ETL</text>
  <text class="sub mono" x="275.0" y="247.0" text-anchor="middle">promo-uplift-etl</text>
  <text class="sub" x="275.0" y="262.0" text-anchor="middle">19 CTEs, por mes</text>
  <rect class="box" x="385" y="200" width="160" height="70" rx="6"/>
  <text class="title" x="465.0" y="227.0" text-anchor="middle">Dataset</text>
  <text class="sub mono" x="465.0" y="247.0" text-anchor="middle">train-set-features.csv</text>
  <text class="sub" x="465.0" y="262.0" text-anchor="middle">tienda × genérico × día</text>
  <rect class="box" x="590" y="60" width="270" height="80" rx="6"/>
  <text class="title" x="725.0" y="92.0" text-anchor="middle">Pipeline training</text>
  <text class="sub mono" x="725.0" y="112.0" text-anchor="middle">tune → train → cv ‖ explain</text>
  <text class="sub" x="725.0" y="127.0" text-anchor="middle">bajo demanda · auto si falla el gate</text>
  <rect x="910" y="60" width="170" height="80" rx="6" fill="#14212B"/>
  <text class="title" x="995.0" y="92.0" text-anchor="middle" style="fill:#FFFFFF">models/</text>
  <text x="995.0" y="112.0" text-anchor="middle" font-size="11.5" fill="#CBD0D3">modelo champion</text>
  <text class="mono" x="995.0" y="127.0" text-anchor="middle" font-size="11.5" fill="#CBD0D3">xgb_base.pkl</text>
  <rect class="box" x="590" y="330" width="270" height="80" rx="6"/>
  <text class="title" x="725.0" y="362.0" text-anchor="middle">Pipeline scoring</text>
  <text class="sub mono" x="725.0" y="382.0" text-anchor="middle">elasticity ‖ score → staging</text>
  <text class="sub mono" x="725.0" y="397.0" text-anchor="middle">→ dryrun → publish</text>
  <text class="sub" x="725" y="428" text-anchor="middle">semanal · lunes 02:00 CST</text>
  <rect class="box" x="910" y="330" width="170" height="80" rx="6" stroke="#A8420E"/>
  <text class="title" x="995.0" y="362.0" text-anchor="middle">S3 publish/</text>
  <text class="sub mono" x="995.0" y="382.0" text-anchor="middle">PROMO_PREDICTIONS</text>
  <text class="sub mono" x="995.0" y="397.0" text-anchor="middle">PROMO_ELASTICITY_CURVES</text>
  <rect class="box" x="910" y="450" width="170" height="62" rx="6"/>
  <text class="title" x="995.0" y="480.0" text-anchor="middle">Snowflake</text>
  <text class="sub" x="995.0" y="500.0" text-anchor="middle">lo consume Power BI</text>
  <path class="flow" d="M165,235 H200" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M350,235 H385" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text class="label" x="275" y="290" text-anchor="middle">particiones en caché</text>
  <path class="flow" d="M545,222 C567,222 567,100 590,100" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M545,248 C567,248 567,370 590,370" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text class="label" x="560" y="180" text-anchor="end">features</text>
  <path class="flow" d="M860,100 H910" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <path class="flow" d="M995,140 C995,260 900,300 860,345" stroke="#14212B" stroke-width="2" fill="none" marker-end="url(#ink)"/>
  <text class="label" x="975" y="250" text-anchor="end">champion</text>
  <path class="flow" d="M860,385 H910" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>
  <path class="flow" d="M995,410 V450" stroke="#A8420E" stroke-width="2" fill="none" marker-end="url(#rust)"/>
  <text class="label" x="1003" y="438" text-anchor="start">DataOps MERGE</text>
  <path class="flow" d="M620,330 V140" stroke="#8B949B" stroke-width="1.5" fill="none" marker-end="url(#muted)"/>
  <text class="label" x="628" y="200" text-anchor="start">gate fallido → reentrena</text>
  <path class="flow" d="M830,140 V330" stroke="#8B949B" stroke-width="1.5" fill="none" marker-end="url(#muted)"/>
  <text class="label" x="822" y="280" text-anchor="end">training listo → re-score</text>
  <text x="530.0" y="528" fill="#4A5963" font-size="12.5" text-anchor="middle">Dos pipelines de SageMaker comparten un mismo store de modelos. Nada llega a Snowflake sin aprobar el dry run.</text>
</svg>
